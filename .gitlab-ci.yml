stages:
  - test

.test:
  stage: test
  image: ruby:${RUBY_VERSION}-alpine
  variables:
    GIT_DEPTH: "1"
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_PATHS: task
    RUBYOPT: --enable-frozen-string-literal
  before_script:
    - if command -v apk > /dev/null; then apk add --no-cache git diffutils; fi # git for pulling fork for method_source
    - bundle install --retry=3
    - unset CI # Don't run coverage
  script:
    - ruby -vr bundler/setup -S rake test

ruby:3.4:
  extends: .test
  variables:
    RUBY_VERSION: '3.4'

ruby:4.0:
  extends: .test
  variables:
    RUBY_VERSION: '4.0'

jruby:latest:
  extends: .test
  image: jruby:latest
  before_script:
    - apt-get update && apt-get install -y git # git for pulling fork for method_source
    - bundle install --retry=3
    - unset CI # Don't run coverage
